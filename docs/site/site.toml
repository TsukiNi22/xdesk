logo = "../logo.svg"

[home]
title = { en = "xdesk documentation", fr = "Documentation de xdesk" }
tagline = { en = "Remote desktop and remote terminal in one binary for Windows and Unix: a one time code, end to end TLS 1.3 with a post-quantum key exchange, and the person in front of the PC decides who stays.", fr = "Bureau et terminal à distance en un seul binaire pour Windows et Unix : un code à usage unique, TLS 1.3 de bout en bout avec un échange de clés post-quantique, et la personne devant le PC décide qui reste." }
