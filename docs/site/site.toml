# xdesk documentation site (better-html-doc) - build: python3 ~/.claude/skills/better-html-doc/scripts/build_site.py --site docs/site --out docs
# The built pages are committed in docs/ (published on gh-pages by docs.yml); gen/*.py read the commands and settings from the sources

[site]
name = "xdesk"
langs = ["en", "fr"]
repo = "https://github.com/TsukiNi22/xdesk"
edit_url = ""
pages_url = "https://tsukini22.github.io/xdesk/docs/"
